{% extends "base.html" %}

{% block title %}Login - Roommate Split{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 2rem 0;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.25rem 2rem; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--accent-primary-light); color: var(--accent-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; box-shadow: 0 4px 14px var(--accent-primary-glow);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; color: var(--text-primary);">
        Household Login
      </h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; margin: 0 auto; max-width: 320px;">
        Enter your shared household password to access expenses, balances, and settlements.
      </p>
    </div>

    <form method="POST" action="{{ url_for('login', next=next_url) }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" for="password" style="font-weight: 600; font-size: 0.88rem;">Household Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required autofocus style="padding-left: 2.6rem; font-size: 1rem; letter-spacing: 0.05em;">
          <div style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; display: flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
        <span>Unlock Household</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      🔒 Protected with constant-time verification &amp; rate limiting
    </div>
  </div>
</div>
{% endblock %}
